<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7e22ce"/>
    </marker>
    <style>
      .bg { fill: #ffffff; rx: 10; }
      .group-host { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 10; }
      .group-containers { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 10; }
      .group-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1e293b; }
      .node-host { fill: #ffffff; stroke: #334155; stroke-width: 1.6; rx: 7; }
      .node-gpu { fill: #faf5ff; stroke: #7e22ce; stroke-width: 1.6; rx: 7; }
      .node-c1 { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.6; rx: 7; }
      .node-c2 { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.6; rx: 7; }
      .node-c3 { fill: #ffffff; stroke: #334155; stroke-width: 1.6; rx: 7; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="220" class="bg"/>

  <!-- ================= LEFT: HOST & GPU TOOLCHAIN ================= -->
  <rect x="15" y="15" width="380" height="190" class="group-host"/>
  <text x="28" y="35" class="group-title">Host Workstation &amp; GPU Toolchain</text>

  <rect x="32" y="48" width="346" height="62" class="node-host"/>
  <text x="205" y="73" class="title">Host Workstation</text>
  <text x="205" y="92" class="sub">(Git Worktrees + Shared /opt/turtlebot3_ws)</text>

  <rect x="32" y="126" width="346" height="64" class="node-gpu"/>
  <text x="205" y="151" class="title">Auto-CUDA PyTorch (.scripts/install_torch.sh)</text>
  <text x="205" y="170" class="sub">sm_86 (cu121) | sm_89 (cu124) | sm_120 (cu132)</text>

  <!-- ================= RIGHT: ISOLATED CONTAINERS ================= -->
  <rect x="495" y="15" width="550" height="190" class="group-containers"/>
  <text x="510" y="35" class="group-title">Isolated Parallel DevContainers (Deterministic Port Hashing)</text>

  <!-- Container 1 -->
  <rect x="520" y="45" width="505" height="45" class="node-c1"/>
  <text x="772" y="65" class="title">Container: lstm_per_seed42 (SAC + LSTM + PER)</text>
  <text x="772" y="81" class="sub">Zenoh Router: Port 7507  |  Gazebo Master: Port 11397</text>

  <!-- Container 2 -->
  <rect x="520" y="100" width="505" height="45" class="node-c2"/>
  <text x="772" y="120" class="title">Container: lstm_uniform_seed42 (SAC + LSTM Uniform)</text>
  <text x="772" y="136" class="sub">Zenoh Router: Port 7485  |  Gazebo Master: Port 11412</text>

  <!-- Container 3 -->
  <rect x="520" y="155" width="505" height="45" class="node-c3"/>
  <text x="772" y="175" class="title">Container: mlp_seed42 (SAC + MLP Baseline)</text>
  <text x="772" y="191" class="sub">Zenoh Router: Port 7543  |  Gazebo Master: Port 11389</text>

  <!-- Solid Branching Arrows from Host -> C1, C2, C3 -->
  <path d="M 378 79 L 440 79 L 440 67 L 520 67" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 378 79 L 440 79 L 440 122 L 520 122" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 378 79 L 440 79 L 440 177 L 520 177" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Dashed Branching Arrows from GPU -> C1, C2, C3 -->
  <path d="M 378 158 L 468 158 L 468 67 L 520 67" fill="none" stroke="#7e22ce" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
  <path d="M 378 158 L 468 158 L 468 122 L 520 122" fill="none" stroke="#7e22ce" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
  <path d="M 378 158 L 468 158 L 468 177 L 520 177" fill="none" stroke="#7e22ce" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
</svg>
