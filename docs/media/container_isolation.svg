<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #ffffff; rx: 10; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.6; rx: 8; }
      .box-purple { fill: #faf5ff; stroke: #7e22ce; stroke-width: 1.8; rx: 8; }
      .box-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="120" class="bg"/>

  <!-- Host -->
  <rect x="15" y="20" width="215" height="80" class="box"/>
  <text x="122" y="47" class="title">Host Workstation</text>
  <text x="122" y="66" class="sub">Parallel Git Worktrees</text>
  <text x="122" y="84" class="sub">Auto-CUDA (sm_86 / 89 / 120)</text>

  <line x1="230" y1="60" x2="280" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Container 1 -->
  <rect x="280" y="20" width="195" height="80" class="box-purple"/>
  <text x="377" y="47" class="title">Container: SAC-LSTM+PER</text>
  <text x="377" y="66" class="sub">Zenoh Router: Port 7507</text>
  <text x="377" y="84" class="sub">Gazebo Master: Port 11397</text>

  <!-- Container 2 -->
  <rect x="495" y="20" width="195" height="80" class="box-blue"/>
  <text x="592" y="47" class="title">Container: SAC-LSTM</text>
  <text x="592" y="66" class="sub">Zenoh Router: Port 7485</text>
  <text x="592" y="84" class="sub">Gazebo Master: Port 11412</text>

  <!-- Container 3 -->
  <rect x="710" y="20" width="195" height="80" class="box"/>
  <text x="807" y="47" class="title">Container: SAC-MLP</text>
  <text x="807" y="66" class="sub">Zenoh Router: Port 7543</text>
  <text x="807" y="84" class="sub">Gazebo Master: Port 11389</text>
</svg>
