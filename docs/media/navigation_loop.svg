<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 215" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #ffffff; rx: 10; }
      .group-sensor { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 10; }
      .group-policy { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 10; }
      .group-reward { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 10; }
      .group-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1e293b; }
      .node-blue { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.6; rx: 7; }
      .node-green { fill: #ffffff; stroke: #15803d; stroke-width: 1.6; rx: 7; }
      .node-orange { fill: #ffffff; stroke: #c2410c; stroke-width: 1.6; rx: 7; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
      .edge { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="215" class="bg"/>

  <!-- ================= SUBGRAPH 1: ROS 2 SENSORS ================= -->
  <rect x="12" y="15" width="275" height="185" class="group-sensor"/>
  <text x="24" y="35" class="group-title">ROS 2 Sensors (20 Hz)</text>

  <rect x="26" y="46" width="247" height="62" class="node-blue"/>
  <text x="149" y="71" class="title">/scan: 180 Beams [0.12, 3.5m]</text>
  <text x="149" y="90" class="sub">Norm [0, 1] + Noise (sigma = 0.01)</text>

  <rect x="26" y="122" width="247" height="64" class="node-blue"/>
  <text x="149" y="147" class="title">/odom: 6-D Ego &amp; Goal Metrics</text>
  <text x="149" y="166" class="sub">(d_goal, theta_goal, d_min, v, w, init)</text>

  <!-- ================= SUBGRAPH 2: RECURRENT POLICY ================= -->
  <rect x="330" y="15" width="380" height="185" class="group-policy"/>
  <text x="342" y="35" class="group-title">Recurrent Policy (186-D -&gt; 2-D)</text>

  <rect x="345" y="75" width="165" height="72" class="node-green"/>
  <text x="427" y="103" class="title">SAC-LSTM (512 Units)</text>
  <text x="427" y="121" class="sub">+ Soft-Reset Hidden</text>
  <text x="427" y="136" class="sub">Carryover</text>

  <!-- Arrows Sensors -> LSTM -->
  <path d="M 273 77 L 308 77 L 308 100 L 345 100" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 273 154 L 308 154 L 308 122 L 345 122" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="510" y1="111" x2="538" y2="111" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="538" y="75" width="158" height="72" class="node-green"/>
  <text x="617" y="101" class="title">/cmd_vel (dt = 0.05s)</text>
  <text x="617" y="119" class="sub">v in [-0.05, 0.22] m/s</text>
  <text x="617" y="135" class="sub">w in [-2.5, 2.5] rad/s</text>

  <!-- Arrow Act -> Reward -->
  <line x1="696" y1="111" x2="770" y2="111" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="733" y="102" class="edge">Gazebo Step</text>

  <!-- ================= SUBGRAPH 3: DYNAMIC-AWARE REWARD ================= -->
  <rect x="755" y="15" width="292" height="185" class="group-reward"/>
  <text x="767" y="35" class="group-title">Dynamic-Aware Reward Shaping</text>

  <rect x="770" y="46" width="262" height="58" class="node-orange"/>
  <text x="901" y="70" class="title">Terminal Rewards</text>
  <text x="901" y="89" class="sub">Goal (&lt;0.35m): +50 | Collision (&lt;0.15m): -50</text>

  <rect x="770" y="114" width="262" height="74" class="node-orange"/>
  <text x="901" y="136" class="title">Dense Shaping</text>
  <text x="901" y="153" class="sub">Progress (k=7.0) + Proximity (w=0.51)</text>
  <text x="901" y="168" class="sub">Quadratic Safety (&lt;0.35m, k=-0.51)</text>
  <text x="901" y="182" class="sub">Closing Speed (delta d_min &lt; 0, k=3.09)</text>
</svg>
