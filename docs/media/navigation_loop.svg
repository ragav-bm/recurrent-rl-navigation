<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #ffffff; rx: 10; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.6; rx: 8; }
      .box-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; rx: 8; }
      .box-accent { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; rx: 8; }
      .box-warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; text-anchor: middle; }
      .edge { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="120" class="bg"/>

  <!-- Block 1: Sensors -->
  <rect x="15" y="20" width="190" height="80" class="box-blue"/>
  <text x="110" y="47" class="title">ROS 2 Sensors (20 Hz)</text>
  <text x="110" y="66" class="sub">180 LiDAR Beams [0.12-3.5m]</text>
  <text x="110" y="84" class="sub">+ 6 Ego &amp; Goal Metrics</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="205" y1="60" x2="255" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="230" y="51" class="edge">186-D</text>

  <!-- Block 2: Policy -->
  <rect x="255" y="20" width="185" height="80" class="box-accent"/>
  <text x="347" y="47" class="title">SAC-LSTM Policy</text>
  <text x="347" y="66" class="sub">512 Hidden Units</text>
  <text x="347" y="84" class="sub">Soft-Reset Memory Carryover</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="440" y1="60" x2="490" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="465" y="51" class="edge">/cmd_vel</text>

  <!-- Block 3: Actuation -->
  <rect x="490" y="20" width="175" height="80" class="box"/>
  <text x="577" y="47" class="title">TurtleBot3 Actuation</text>
  <text x="577" y="66" class="sub">v in [-0.05, 0.22] m/s</text>
  <text x="577" y="84" class="sub">w in [-2.5, 2.5] rad/s</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="665" y1="60" x2="710" y2="60" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="687" y="51" class="edge">Step</text>

  <!-- Block 4: Reward -->
  <rect x="710" y="20" width="195" height="80" class="box-warn"/>
  <text x="807" y="47" class="title">Dynamic-Aware Reward</text>
  <text x="807" y="66" class="sub">Goal (+50) | Collision (-50)</text>
  <text x="807" y="84" class="sub">Safety + Closing-Speed Penalty</text>
</svg>
