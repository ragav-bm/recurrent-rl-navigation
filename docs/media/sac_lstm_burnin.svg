<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 250" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7e22ce"/>
    </marker>
    <style>
      .bg { fill: #ffffff; rx: 10; }
      .group-env { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 10; }
      .group-buf { fill: #faf5ff; stroke: #c084fc; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 10; }
      .group-gpu { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 10; }
      .group-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1e293b; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 7; }
      .node-purple { fill: #ffffff; stroke: #7e22ce; stroke-width: 1.6; rx: 7; }
      .node-green { fill: #ffffff; stroke: #15803d; stroke-width: 1.6; rx: 7; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
      .edge { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .edge-purple { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #6b21a8; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="250" class="bg"/>

  <!-- ================= SUBGRAPH 1: REAL-TIME INTERACTION ================= -->
  <rect x="12" y="15" width="215" height="195" class="group-env"/>
  <text x="24" y="35" class="group-title">1. Real-Time Interaction (20 Hz)</text>

  <rect x="27" y="48" width="185" height="58" class="node"/>
  <text x="119" y="72" class="title">State s_t (186-D)</text>
  <text x="119" y="90" class="sub">+ Prev Action a_{t-1} (2-D)</text>

  <line x1="119" y1="106" x2="119" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="27" y="132" width="185" height="62" class="node"/>
  <text x="119" y="158" class="title">Thread-Safe Episode Queue</text>
  <text x="119" y="176" class="sub">(Filter: Ep Len &gt;= 48)</text>

  <!-- ================= SUBGRAPH 2: SEQUENCE PER BUFFER ================= -->
  <rect x="265" y="15" width="235" height="195" class="group-buf"/>
  <text x="277" y="35" class="group-title">2. Sequence PER Buffer (400K Cap)</text>

  <rect x="280" y="48" width="205" height="58" class="node-purple"/>
  <text x="382" y="72" class="title">Contiguous Trajectory Store</text>
  <text x="382" y="90" class="sub">+ Step Hidden States (h_t, c_t)</text>

  <line x1="382" y1="106" x2="382" y2="132" stroke="#7e22ce" stroke-width="1.6" marker-end="url(#arrow-purple)"/>

  <rect x="280" y="132" width="205" height="62" class="node-purple"/>
  <text x="382" y="158" class="title">Prioritized Slice (Batch = 64)</text>
  <text x="382" y="176" class="sub">alpha = 0.6 | IS beta: 0.4 -&gt; 1.0</text>

  <!-- Arrow EpQ -> Store -->
  <path d="M 212 163 L 238 163 L 238 77 L 280 77" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= SUBGRAPH 3: GPU LEARNER ================= -->
  <rect x="555" y="15" width="492" height="195" class="group-gpu"/>
  <text x="567" y="35" class="group-title">3. GPU Learner (SAC-LSTM, 512 Hidden)</text>

  <rect x="570" y="52" width="200" height="62" class="node-green"/>
  <text x="670" y="78" class="title">R2D2 Burn-In (L_burn = 16)</text>
  <text x="670" y="96" class="sub">torch.no_grad() State Warmup</text>

  <!-- Arrow Sample -> Burn -->
  <path d="M 485 163 L 528 163 L 528 83 L 570 83" fill="none" stroke="#7e22ce" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
  <text x="528" y="178" class="edge-purple">48-Step Slice</text>

  <!-- Arrow Burn -> BPTT -->
  <line x1="770" y1="83" x2="830" y2="83" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="800" y="65" class="edge">Refreshed (h, c)</text>
  <text x="800" y="78" class="edge">0.90s -&gt; 0.05s</text>

  <rect x="830" y="52" width="202" height="62" class="node-green"/>
  <text x="931" y="78" class="title">BPTT Training (L_seq = 32)</text>
  <text x="931" y="96" class="sub">Twin-Q + Squashed Gaussian Actor</text>

  <!-- Arrow BPTT -> Opt -->
  <line x1="931" y1="114" x2="931" y2="136" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="830" y="136" width="202" height="60" class="node-green"/>
  <text x="931" y="162" class="title">Auto-Alpha [0.005, 0.03]</text>
  <text x="931" y="180" class="sub">LR = 8e-5 | Grad Clip = 1.6</text>

  <!-- Feedback Arrow BPTT -> Sample (TD-Error) -->
  <path d="M 830 98 L 795 98 L 795 232 L 382 232 L 382 194" fill="none" stroke="#7e22ce" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
  <text x="605" y="225" class="edge-purple">TD-Error |delta| Priority Update</text>
</svg>
